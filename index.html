<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статус доставки — БРЕНД АУТЛЕТ</title>
<style>
  :root {
    --accent: #1d4ed8;
    --bg: #f6f7fb;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .truck-wrap { margin: 10px 0 14px; }
  .truck-wrap svg { width: 100%; max-width: 660px; height: auto; display: block; }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .summary .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .summary .card .num { font-size: 24px; font-weight: 700; }
  .summary .card .label { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    align-items: center;
  }
  .controls input[type=text] {
    flex: 1;
    min-width: 220px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .controls select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: white;
  }

  .grid { display: flex; flex-direction: column; gap: 12px; }

  .row-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .row-card.active-transit {
    border: 2px solid #dc2626;
    box-shadow: 0 0 0 3px rgba(220,38,38,0.08);
  }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }
  .row-id { font-weight: 700; font-size: 15px; }
  .row-sub { color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.5; }
  .row-sub .supplier { font-weight: 700; color: var(--text); }
  .row-sub .goods { color: #1d4ed8; font-weight: 600; }
  .row-sub .sub-dim { color: var(--muted); }
  .note { color: #dc2626; font-weight: 600; font-size: 12.5px; margin-top: 4px; }
  .badge {
    display: inline-block;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px 16px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .meta div span.k { color: var(--muted); display: block; font-size: 11.5px; }
  .meta div span.v { font-weight: 500; }

  .timeline { display: flex; align-items: center; margin-top: 4px; }
  .step { flex: 1; text-align: center; position: relative; }
  .step .dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: #e5e7eb; color: white; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 6px; font-weight: 700;
  }
  .step.done .dot { background: #16a34a; }
  .step.current .dot { background: var(--accent); }
  .step .lbl { font-size: 11px; color: var(--muted); }
  .step .date { font-size: 11.5px; font-weight: 600; margin-top: 1px; }
  .step .line {
    position: absolute; top: 11px; left: -50%; width: 100%; height: 2px;
    background: #e5e7eb; z-index: -1;
  }
  .step:first-child .line { display: none; }
  .step.done .line { background: #16a34a; }

  /* этап с датой в будущем — план, галочки нет */
  .step.planned .dot {
    background: #ffffff;
    border: 2px dashed #9ca3af;
    box-sizing: border-box;
  }
  .step.planned .date { color: var(--muted); font-weight: 500; }

  /* дата в таблице красная — не подтверждена: кружок пустой, обводка красная */
  .step.unconfirmed .dot {
    background: #ffffff;
    border: 2.5px solid #dc2626;
    box-sizing: border-box;
  }
  .step.unconfirmed .date { color: #dc2626; font-weight: 600; }
  .unconfirmed-tag {
    color: #dc2626;
    background: #fef2f2;
    border-color: #fecaca;
  }

  /* «Прибытие на таможню» ещё не наступило — выделяем красным */
  .step.customs-pending .dot { border-color: #dc2626; }
  .step.customs-pending .lbl { color: #dc2626; font-weight: 700; }
  .step.customs-pending .date { color: #dc2626; font-weight: 700; }
  .step.customs-pending .plan-tag {
    color: #dc2626;
    background: #fef2f2;
    border-color: #fecaca;
  }
  .plan-tag {
    display: inline-block;
    margin-top: 3px;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #6b7280;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
  }

  /* ---------- кнопка РАСЧЁТ и окно ---------- */
  .actions { display: flex; gap: 8px; margin: 12px 0 2px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; padding: 6px 13px;
    border-radius: 7px; border: 1px solid #e5e7eb; background: #ffffff;
    color: var(--text); font-size: 12px; font-weight: 700; font-family: inherit;
    letter-spacing: 0.02em; cursor: pointer; white-space: nowrap;
  }
  .btn-calc { border-color: #f1c6cd; color: #9D152D; background: #fdf3f4; }
  .btn-calc:hover { background: #fae7ea; }
  .btn[disabled] { opacity: 0.45; cursor: default; }

  .modal {
    position: fixed; inset: 0; z-index: 100; background: rgba(17,24,39,0.55);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal[hidden] { display: none; }
  .modal-box {
    background: #fff; border-radius: 12px; width: 100%; max-width: 560px;
    max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-close {
    border: none; background: none; font-size: 26px; line-height: 1;
    color: var(--muted); cursor: pointer; padding: 0 4px;
  }
  .modal-body { overflow: auto; }
  .calc-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .calc-table td { border-bottom: 1px solid var(--border); padding: 8px 16px; }
  .calc-table td:nth-child(2) { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .calc-table td:nth-child(3) { color: var(--muted); width: 54px; }
  .calc-table tr.calc-head td {
    background: #f9fafb; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--muted);
  }
  .calc-table tr.calc-total td {
    font-weight: 800; font-size: 14px; background: #fdf3f4; color: #9D152D;
    border-top: 2px solid #f1c6cd;
  }
  .calc-table tr.calc-aux td { color: var(--muted); font-size: 12px; }

  .empty { text-align: center; color: var(--muted); padding: 40px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; padding-bottom: 12px; }

  /* ---------- Мобильная версия ---------- */
  @media (max-width: 640px) {
    body { padding: 0; }
    .wrap { max-width: 100%; }

    header { padding: 14px 14px 4px; margin-bottom: 12px; }
    header h1 { font-size: 17px; line-height: 1.3; }
    header p { font-size: 12px; }
    .truck-wrap { margin: 8px 0 10px; }
    .truck-wrap svg { max-width: 100%; }
    .row-card.active-transit { border-width: 2px; }

    .summary {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 0 14px;
      margin-bottom: 14px;
    }
    .summary .card { padding: 10px 12px; }
    .summary .card .num { font-size: 19px; }
    .summary .card .label { font-size: 11px; }

    .controls {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: 8px 14px 10px;
      margin: 0 0 10px;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 8px -6px rgba(0,0,0,0.15);
    }
    .controls input[type=text],
    .controls select {
      width: 100%;
      min-width: 0;
      font-size: 16px; /* предотвращает авто-зум на iOS при фокусе */
      padding: 11px 12px;
    }

    .grid { padding: 0 14px; gap: 10px; }

    .row-card { padding: 13px 14px; border-radius: 10px; }
    .row-id { font-size: 14px; }
    .row-sub { font-size: 12px; }
    .note { font-size: 11.5px; }
    .badge { font-size: 11.5px; padding: 3px 9px; }

    .meta {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .timeline { margin-top: 2px; }
    .step .dot { width: 18px; height: 18px; font-size: 10px; margin-bottom: 4px; }
    .step .lbl { font-size: 9px; line-height: 1.2; }
    .step .date { font-size: 9.5px; }
    .step .line { top: 9px; }
    .plan-tag { font-size: 8.5px; padding: 1px 5px; margin-top: 2px; }

    .empty { padding: 30px 14px; }
    footer { padding: 0 14px 16px; }
  }

  /* очень узкие экраны — подписи шагов таймлайна короче не влезают, скрываем даты под точками */
  @media (max-width: 380px) {
    .step .date { display: none; }
  }
</style>
</head>

const STATUS_STYLE = {"доставлен": {"label": "Доставлено", "color": "#1a7f37", "bg": "#dcfce7"}, "доставлены": {"label": "Доставлено", "color": "#1a7f37", "bg": "#dcfce7"}, "растаможен": {"label": "Растаможен", "color": "#0e7490", "bg": "#cffafe"}, "в пути": {"label": "В пути", "color": "#9a5b00", "bg": "#fef3c7"}, "заказан": {"label": "Заказан", "color": "#7c3aed", "bg": "#ede9fe"}, "планируется": {"label": "Планируется", "color": "#3730a3", "bg": "#e0e7ff"}};
const DEFAULT_STYLE = { color: "#374151", bg: "#e5e7eb" };

function styleFor(statusKey) {
  return STATUS_STYLE[statusKey] || DEFAULT_STYLE;
}

function renderSummary(data) {
  const total = data.length;
  const delivered = data.filter(isDelivered).length;
  const inTransit = data.filter(d => !isDelivered(d)).length;
  const totalQty = data.reduce((s, d) => s + (Number(d.qty) || 0), 0);
  const totalBoxes = data.reduce((s, d) => s + (Number(d.boxes) || 0), 0);

  const cards = [
    ["Всего заявок", total],
    ["Доставлено", delivered],
    ["В работе", inTransit],
    ["Штук, всего", totalQty.toLocaleString("ru-RU")],
    ["Коробок, всего", totalBoxes.toLocaleString("ru-RU")],
  ];
  document.getElementById("summary").innerHTML = cards.map(([label, num]) =>
    `<div class="card"><div class="num">${num}</div><div class="label">${label}</div></div>`
  ).join("");
}

function populateStatusFilter(data) {
  const sel = document.getElementById("statusFilter");
  const statuses = [...new Set(data.map(d => d.status))];
  statuses.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  });
}

const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();

function parseRuDate(s) {
  if (!s) return null;
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(s).trim());
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  d.setHours(0, 0, 0, 0);
  return isNaN(d.getTime()) ? null : d;
}

function stepState(rec) {
  // Этап считается пройденным только если дата указана И уже наступила.
  // Дата в будущем — это план: галочку не ставим, помечаем «план».
  const steps = [
    { key: "load",     field: "dt_load",             label: "Загрузка",            date: rec.dt_load },
    { key: "customs",  field: "dt_customs_arrival",  label: "Прибытие на таможню", date: rec.dt_customs_arrival },
    { key: "release",  field: "dt_customs_release",  label: "Выпуск с таможни",    date: rec.dt_customs_release },
    { key: "delivery", field: "dt_delivery_planned", label: "Доставка",            date: rec.dt_delivery_planned },
  ];

  const unconfirmed = rec.unconfirmed || {};
  let lastDoneIdx = -1;
  steps.forEach((s, i) => {
    const d = parseRuDate(s.date);
    // красная дата в таблице — не подтверждена, этап не засчитываем
    s.unconfirmed = !!unconfirmed[s.field];
    s.planned = !s.unconfirmed && d !== null && d > TODAY;
    s.done = !!s.date && !s.planned && !s.unconfirmed;
    if (s.done) lastDoneIdx = i;
  });

  // последний шаг закрываем только когда заявка реально доставлена
  if (steps[3].done && !isDelivered(rec)) {
    steps[3].done = false;
    if (lastDoneIdx === 3) lastDoneIdx = 2;
  }

  const currentIdx = Math.min(lastDoneIdx + 1, 3);
  steps.forEach((s, i) => { s.current = (i === currentIdx && !s.done); });
  return steps;
}

function renderCard(rec) {
  const st = styleFor(rec.status_key);
  const steps = stepState(rec);
  const stepsHtml = steps.map(s => `
    <div class="step ${s.done ? "done" : ""} ${s.current ? "current" : ""} ${s.planned ? "planned" : ""} ${s.unconfirmed ? "unconfirmed" : ""} ${(s.key === "customs" && s.planned) ? "customs-pending" : ""}">
      <div class="line"></div>
      <div class="dot">${s.done ? "✓" : ""}</div>
      <div class="lbl">${s.label}</div>
      <div class="date">${s.date || "—"}</div>
      ${s.unconfirmed ? `<div class="plan-tag unconfirmed-tag">не подтв.</div>` : s.planned ? `<div class="plan-tag">план</div>` : ""}
    </div>
  `).join("");

  const activeClass = isDelivered(rec) ? "" : "active-transit";
  return `
  <div class="row-card ${activeClass}" data-id="${rec.id}" data-status="${rec.status}"
       data-search="${(rec.id + " " + rec.supplier + " " + rec.carrier + " " + rec.customs_place).toLowerCase()}">
    <div class="row-top">
      <div>
        <div class="row-id">Заявка № ${rec.id}</div>
        <div class="row-sub">
          <span class="supplier">${rec.supplier || "—"}</span>${rec.goods ? ` <span class="goods">${rec.goods}</span>` : ""}
          <span class="sub-dim">· перевозчик: ${rec.carrier || "—"}${rec.transport ? " · " + rec.transport : ""}</span>
        </div>
        ${rec.note ? `<div class="note">${rec.note}</div>` : ""}
      </div>
      <span class="badge" style="color:${st.color}; background:${st.bg}">${rec.status}</span>
    </div>
    <div class="meta">
      <div><span class="k">Место таможни</span><span class="v">${rec.customs_place || "—"}</span></div>
      <div><span class="k">Кол-во штук</span><span class="v">${rec.qty ?? "—"}</span></div>
      <div><span class="k">Кол-во коробок</span><span class="v">${rec.boxes ?? "—"}</span></div>
      <div><span class="k">Объём, м³</span><span class="v">${rec.volume ?? "—"}</span></div>
      <div><span class="k">Сумма инвойса</span><span class="v">${rec.amount || "—"}</span></div>
      <div><span class="k">${isDelivered(rec) ? "Дата доставки" : "Плановая доставка"}</span><span class="v">${rec.dt_delivery_planned || "—"}</span></div>
    </div>
    <div class="timeline">${stepsHtml}</div>
    ${(rec.raschet && rec.raschet.length)
        ? `<div class="actions"><button class="btn btn-calc" data-calc="${rec.id}">РАСЧЁТ</button></div>`
        : ""}
  </div>`;
}

function applyFilters() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const statusVal = document.getElementById("statusFilter").value;
  let visible = 0;
  document.querySelectorAll(".row-card").forEach(card => {
    const matchesQ = !q || card.dataset.search.includes(q);
    const matchesStatus = !statusVal || card.dataset.status === statusVal;
    const show = matchesQ && matchesStatus;
    card.style.display = show ? "" : "none";
    if (show) visible++;
  });
  document.getElementById("emptyState").style.display = visible === 0 ? "block" : "none";
}

const DELIVERED = ["доставлен", "доставлены"];
function isDelivered(rec) { return DELIVERED.includes(rec.status_key); }

function sortNotDeliveredFirst(data) {
  // 1) недоставленные (в пути) — всегда сверху, порядок как в файле
  // 2) доставленные — ниже, по дате доставки на склад, свежие первыми
  //    (заявки без даты уходят в самый конец)
  return data.slice().sort((a, b) => {
    const pa = isDelivered(a) ? 1 : 0;
    const pb = isDelivered(b) ? 1 : 0;
    if (pa !== pb) return pa - pb;
    if (pa === 0) return 0;               // порядок «в пути» не трогаем

    const da = parseRuDate(a.dt_delivery_planned);
    const db = parseRuDate(b.dt_delivery_planned);
    if (!da && !db) return 0;
    if (!da) return 1;                     // без даты — в конец
    if (!db) return -1;
    return db - da;                        // по убыванию: свежие выше
  });
}

const SORTED_DATA = sortNotDeliveredFirst(DATA);

renderSummary(SORTED_DATA);
populateStatusFilter(SORTED_DATA);
document.getElementById("grid").innerHTML = SORTED_DATA.map(renderCard).join("");
document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);

/* ---------- окно «РАСЧЁТ» ---------- */
function esc(v) {
  return String(v).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[ch]);
}

const calcModal = document.getElementById("calcModal");

function openCalc(id) {
  const rec = DATA.find(r => r.id === id);
  if (!rec || !rec.raschet) return;

  document.getElementById("calcTitle").textContent =
    `Заявка № ${rec.id} — расчёт поставки`;

  document.getElementById("calcBody").innerHTML = rec.raschet.map(row => {
    const name = (row[0] || "").trim();
    const low = name.toLowerCase();
    let cls = "";
    if (low === "итого") cls = "calc-total";
    else if (low === "категория") cls = "calc-head";
    else if (!name || low.startsWith("курс") || low.startsWith("%") || low.startsWith("за кг")) cls = "calc-aux";
    return `<tr class="${cls}">` + row.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>";
  }).join("");

  calcModal.hidden = false;
  document.body.style.overflow = "hidden";
}

function closeCalc() {
  calcModal.hidden = true;
  document.body.style.overflow = "";
}

document.getElementById("grid").addEventListener("click", e => {
  const btn = e.target.closest("[data-calc]");
  if (btn) openCalc(btn.dataset.calc);
});
document.getElementById("calcClose").addEventListener("click", closeCalc);
calcModal.addEventListener("click", e => { if (e.target === calcModal) closeCalc(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCalc(); });
</script>
